spring:
  application:
    name: TaskManagerApplication-Test

  datasource:
    # Use a different DB name for tests to prevent locking
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: true
    # Ensures Flyway runs even if tables exist from previous test runs
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 9090

logging:
  level:
    root: WARN
    com.taskmanager: DEBUG

