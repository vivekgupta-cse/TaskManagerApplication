spring:
  application:
    name: TaskManagerApplication-Test

  datasource:
    # Points to the postgres-test container started via docker-compose-test.yml
    # docker-compose-test.yml maps container port 5432 → host port 5433
    url: jdbc:postgresql://localhost:5433/taskdb
    driver-class-name: org.postgresql.Driver
    username: docker
    password: docker

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      # Use 'none' — Flyway already owns schema management.
      # 'validate' causes SchemaManagementException on fresh containers
      # because it runs AFTER Flyway but independently checks every column.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 0                       # Random port — avoids conflicts with the running app

logging:
  level:
    root: WARN
    com.taskmanager: DEBUG

