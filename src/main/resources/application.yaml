spring:
  application:
    name: TaskManagerApplication

  datasource:
    #url: jdbc:postgresql://localhost:5432/taskdb
    url: jdbc:postgresql://localhost:5432/taskdb
    username: ${DB_USERNAME:docker}
    password: ${DB_PASSWORD:docker}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false             # Disabled — this prints to stdout only, bypassing the log file
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      # This ensures JPA waits for Flyway even if the auto-detection fails
      javax.persistence.schema-generation.database.action: none

  flyway:
    enabled: true
    baseline-on-migrate: true # Useful when adding Flyway to an existing DB

  threads:
    virtual:
      enabled: true

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: '*'

    jmx:
      exposure:
        include: health,info,metrics

logging:
  file:
    name: logs/app.log          # Log file path — relative to project root
  logback:
    rollingpolicy:
      max-file-size: 10MB       # Rotate when file reaches 10MB
      max-history: 7            # Keep last 7 rotated files, delete older ones
      file-name-pattern: logs/app-%d{yyyy-MM-dd}.%i.log  # Rotated file naming
  level:
    root: INFO                                    # Default log level for everything
    com.example.TaskManagerApplication: DEBUG     # Your code logs at DEBUG level
    org.hibernate.SQL: DEBUG                      # Logs the SQL queries (replaces show-sql: true)
    org.hibernate.orm.jdbc.bind: TRACE            # Logs the actual values bound to ? placeholders

# Note: To enable the health endpoint, set management.endpoints.web.exposure.include=health,info
