spring:
  application:
    name: TaskManagerApplication

  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: ${DB_USERNAME:docker}
    password: ${DB_PASSWORD:docker}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false             # Disabled — this prints to stdout only, bypassing the log file
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      # This ensures JPA waits for Flyway even if the auto-detection fails
      javax.persistence.schema-generation.database.action: none

  flyway:
    enabled: true
    baseline-on-migrate: true # Useful when adding Flyway to an existing DB

  threads:
    virtual:
      enabled: true

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: 'health,info,prometheus'

  endpoint:
    health:
      show-details: when-authorized   # hide DB details from anonymous callers
      probes:
        enabled: true

    jmx:
      exposure:
        include: health,info

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

  tracing:
    enabled: true
    export:
      otlp:
        enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.10}

  otlp:
    tracing:
      transport: http
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}


# Note: To enable the health endpoint, set management.endpoints.web.exposure.include=health,info

jwt:
  secret: ${JWT_SECRET:my-local-dev-secret-only}
  expiry-seconds: 3600