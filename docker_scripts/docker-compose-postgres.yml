services:
  db:
    image: postgres:16
    container_name: postgres-app
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    # Bind mount DB data to a local folder so host file permissions can be controlled easily
    volumes:
      - ../database/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U docker" ]
      interval: 10s
      timeout: 5s
      retries: 5